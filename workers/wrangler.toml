name = "coup-server"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Generates src/version.ts (git hash, reported by /api/health).
[build]
command = "bash scripts/version.sh"

[durable_objects]
bindings = [
  { name = "GAME", class_name = "GameRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Matchmaker", "GameRoom"]

# Room creation moved to POST /api/rooms; the Matchmaker DO (which kept its room
# list only in memory and lost it on eviction) is gone.
[[migrations]]
tag = "v2"
deleted_classes = ["Matchmaker"]

# Import .wasm files as WebAssembly.Module
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false
