[base]
env_name = coup

# Every seat at a table is an agent row, but only the seat to act has more than
# one legal action (the rest are PASS-only no-ops that still update the RNN).
# So with a mixed 2-6 table, roughly 1 in 4 agent-steps is a real decision.
# Tables are planned per buffer so any total_agents / num_buffers works.
[vec]
total_agents = 8192
num_buffers = 2
# Env stepping is cheap (~9M agent-steps/s per core on an M4, make bench-puffer);
# the GPU forward pass is the bottleneck, so a few threads per buffer suffice.
num_threads = 8
# Policy 0 learns. In the hist_policy_percent tail of envs, agent 0 is policy 0
# and every other seat is a frozen checkpoint (env/hist_win_rate).
num_policies = 2
hist_policy_percent = 0.25
hist_policy_hidden_size = 256
hist_policy_num_layers = 3

# Selfplay pool. Final score = mean env/perf (agent 0 win rate) over the
# eval_bots ladder with one learner seat and the rest scripted.
[selfplay]
enabled = 1
max_size = 64
opp_timeout_steps = 200_000_000
eval_pool_size = 8
eval_games = 0
eval_bot_games = 8192
# Rungs are [env] bot_policy ids = c_engine/heuristic.h levels:
# 0 random, 1 honest (never bluffs/challenges), 2 counting (honest + calls
# provable bluffs).
eval_bots = 0, 1, 2
eval_bot_envs = 4096

# Per-rung [env] overrides for the bot ladder (it forces num_agents = 1).
[bot_eval]

[env]
# 2..6, or 0 for a mixed table size per env (one policy for every table size;
# the observation one-hots the player count).
num_players = 0
# Learning seats per table (clamped to num_players). Seats past this are bots.
num_agents = 6
# Bot for non-learning seats (heuristic.h level): 0 random, 1 honest, 2 counting.
bot_policy = 2
# Optional shaping: reward per influence (card) lost. Terminal reward is +1 for
# the winner and -1/(n-1) for every loser (zero-sum).
reward_influence = 0.0

# Recurrent (MinGRU) default policy. Every seat gets an obs on every env step,
# so each seat's stream contains every public event; the obs holds the last 8
# and the RNN carries older claim/bluff history in its hidden state. 587 sparse
# 0/1 inputs; 256 hidden is plenty to start.
[policy]
hidden_size = 256
num_layers = 3

# Rewards are terminal only. Random play lasts 15 (2p) to 50 (6p) env steps;
# real play is likely longer (MAX_TURNS = 200 main actions caps it), so
# long credit assignment: high gamma, high lambda, horizon 128 with
# RNN carry across horizons. ent_coef is on the high side because Coup's
# equilibria are mixed (bluff and challenge frequencies); anneal it late.
[train]
total_timesteps = 3_000_000_000
learning_rate = 0.002
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.997
gae_lambda = 0.95
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.01
anneal_ent_coef = 1
min_ent_coef_ratio = 0.1
momentum = 0.95
minibatch_size = 32768
horizon = 128

[sweep]
# perf is the agent-0 win rate. Use the bot ladder (eval_bot_games) as the
# final score; in pure selfplay perf sits near 1/num_players by symmetry.
metric = perf

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e8
max = 1e10
mean = 2e9
scale = time

[sweep.vec.hist_policy_percent]
distribution = uniform
min = 0.05
max = 0.5
mean = 0.25
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0005
max = 0.05
mean = 0.01
scale = auto
